name: Build APK

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SummitSaver-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Rename APK
        if: github.event_name != 'pull_request'
        run: cp app/build/outputs/apk/debug/app-debug.apk SummitSaver.apk

      # Publishes the APK as a GitHub Release so it can be downloaded directly
      # (no zip) from the repository's Releases page.
      - name: Publish release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Summit Saver build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          body: "Test build from ${{ github.ref_name }} (${{ github.sha }}). Download **SummitSaver.apk** below."
          files: SummitSaver.apk
          make_latest: true
